plugins {
    id 'com.android.application'
}

android {
    namespace 'com.crismotion.shakelight'
    compileSdk 34

    signingConfigs {
        fija {
            storeFile file('shakelight.jks')
            storePassword 'shakelight'
            keyAlias 'shakelight'
            keyPassword 'shakelight'
        }
    }

    defaultConfig {
        applicationId 'com.crismotion.shakelight'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
